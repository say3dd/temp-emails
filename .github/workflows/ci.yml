name: Windows CI

on:
  push:
      branches: [master]
  
  workflow_dispatch:



jobs:
  test:
    name: Windows CI Test suite  
    runs-on: windows-latest

    steps:
      - name: Checkout the source code
        uses: actions/checkout@v7

      - name: Set up python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      
      - name: Install dependencies
        run: uv sync --locked
      
      - name: Check syntax
        run: uv run --locked python -m compileall -q main.py tests
      
      - name: Run linter
        run: uv run --locked ruff check --select E4,E7,E9,F main.py tests
      
      - name: Run tests
        run: uv run --locked pytest -v

      - name: Create executable
        run: py -m PyInstaller --onefile --console --name TempEmail main.py
